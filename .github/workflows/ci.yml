name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Test Homebrew formula generation
        run: bash scripts/generate-homebrew-formula_test.sh

      - name: Build
        run: go build ./cmd/agentops

  isolation-spike:
    # Go 1.22's internal linker does not emit the UUID required by newer macOS.
    env:
      GOFLAGS: ${{ matrix.os == 'macos-latest' && '-ldflags=-linkmode=external' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./internal/opscloudflarepayload -run TestIsolationSpike -count=20

  credential-security:
    env:
      GOFLAGS: ${{ matrix.os == 'macos-latest' && '-ldflags=-linkmode=external' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test credential file security
        run: go test -race ./internal/opscredentials -count=1 -timeout=60s
      - name: Repeat credential mutation tests
        run: go test ./internal/opscredentials -run 'TestReadDotenvFileSecurity|TestDotenvReplacementDuringRead|TestDotenvSizeLimit' -count=20 -timeout=60s
